<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="זמני תפילות בית הכנסת – שחרית, מנחה, ערבית ותפילות שבת">
  <title>זמני תפילות | בית כנסת מטה משה</title>
  <!-- תצוגה מקדימה בשיתוף (וואטסאפ, פייסבוק וכו׳) – תמונה גדולה מ-300 פיקסלים מוצגת בגדול -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">
  <meta property="og:url" content="https://bsaviran.github.io/Mate-Moshe/">
  <meta property="og:title" content="זמני תפילות | בית כנסת מטה משה">
  <meta property="og:description" content="זמני תפילות בית הכנסת – שחרית, מנחה, ערבית ותפילות שבת">
  <meta property="og:image" content="https://bsaviran.github.io/Mate-Moshe/logo.jpeg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="640">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="לוגו בית הכנסת מטה משה – היכל רבנו יורם, חולון">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="img/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.jpg">

  <!-- טעינה מוקדמת: תמונת הרקע העליונה (הרכיב הגדול בעמוד) והגופנים (הלטיניים כוללים את הספרות של השעות) -->
  <link rel="preload" href="img/synagogue-900.webp" as="image" type="image/webp" fetchpriority="high" media="(max-width: 640px)">
  <link rel="preload" href="img/synagogue-1520.webp" as="image" type="image/webp" fetchpriority="high" media="(min-width: 641px)">
  <link rel="preload" href="fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/frank-ruhl-libre-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/frank-ruhl-libre-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/heebo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- חיבור מוקדם לשרת זמני היום -->
  <link rel="preconnect" href="https://www.hebcal.com" crossorigin>

  <!-- קובץ העיצוב (כולל הגופנים) -->
  <link rel="stylesheet" href="style.css?v=27">
  <!-- קובץ הלוגיקה והנתונים. נטען במקביל לעיצוב, והעמוד מוצג רק אחרי שהזמנים הוכנסו (כדי שלא "יקפוץ") -->
  <script src="script.js?v=27" defer blocking="render"></script>
</head>
<body>

  <!-- כותרת עליונה -->
  <header class="hero">
    <!-- תמונת בית הכנסת ברקע (עמומה) -->
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="logo-frame">
        <picture>
          <source srcset="img/logo-480.webp" type="image/webp">
          <img src="logo.jpeg" alt="לוגו בית הכנסת מטה משה – היכל רבנו יורם, חולון" class="logo" width="640" height="640">
        </picture>
      </div>
      <p class="eyebrow">בית הכנסת</p>
      <h1 id="synagogue-name">מטה משה</h1>
      <p class="tagline" id="synagogue-tagline">״היכל רבנו יורם״</p>
      <p class="subtitle" id="synagogue-address">רחוב החרצית 5, חולון</p>

      <div class="dates">
        <div class="date-card">
          <span class="date-label">תאריך</span>
          <span class="date-values">
            <span class="date-value" id="hebrew-date">—</span>
            <span class="date-sub" id="gregorian-date">—</span>
          </span>
        </div>
        <div class="date-card">
          <span class="date-label">השעה כעת</span>
          <span class="date-value clock" id="clock">—</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- התפילה הבאה -->
    <!-- שלד זמני באותו גודל כמו התוכן הסופי (כדי שהעמוד לא "יקפוץ" בטעינה). script.js ממלא אותו. -->
    <section class="next-prayer" id="next-prayer" aria-label="הבא בבית הכנסת">
      <div>
        <div class="np-label">התפילה הבאה</div>
        <div class="np-name">&nbsp;</div>
      </div>
      <div>
        <div class="np-time">--:--</div>
        <div class="np-countdown">&nbsp;</div>
      </div>
    </section>
    <!-- הודעה לקוראי מסך – מתעדכנת רק כשהתפילה הבאה מתחלפת (ולא בכל דקה) -->
    <p class="sr-only" id="next-prayer-announce" aria-live="polite" aria-atomic="true"></p>

    <!-- תפילות ימי חול -->
    <section class="section" aria-labelledby="weekday-title">
      <div class="section-head">
        <h2 id="weekday-title">תפילות ימי חול</h2>
        <p class="section-note" id="weekday-note"></p>
      </div>
      <div class="prayer-grid" id="weekday-prayers">
        <!-- הכרטיסים נוצרים אוטומטית מתוך script.js -->
      </div>
    </section>

    <!-- תפילות שבת -->
    <section class="section shabbat" aria-labelledby="shabbat-title">
      <div class="section-head">
        <h2 id="shabbat-title">תפילות שבת</h2>
        <p class="section-note" id="shabbat-note"></p>
      </div>
      <div class="shabbat-columns" id="shabbat-prayers">
        <!-- הרשימות נוצרות אוטומטית מתוך script.js -->
      </div>
    </section>

    <!-- שיעורי תורה -->
    <section class="section lessons-panel" aria-labelledby="lessons-title">
      <div class="section-head">
        <h2 id="lessons-title">שיעורי תורה</h2>
      </div>
      <div class="prayer-grid lessons-grid" id="lessons">
        <!-- הכרטיסים נוצרים אוטומטית מתוך script.js -->
      </div>
    </section>

    <!-- כולל אברכים -->
    <section class="section kollel" aria-labelledby="kollel-title">
      <div class="section-head">
        <h2 id="kollel-title">כולל אברכים מצטיינים ״מטה משה״</h2>      </div>
      <figure class="gallery-frame">
        <button type="button" class="gallery-open" id="kollel-open" aria-haspopup="dialog">
          <picture>
            <source type="image/webp" srcset="img/kollel-1100.webp 1100w, img/kollel-2000.webp 2000w" sizes="(max-width: 1100px) calc(100vw - 44px), 1056px">
            <img src="img/kollel-1100.jpg" alt="אברכי כולל מטה משה, שנת תשפ״ו" width="2758" height="1548" loading="lazy" decoding="async">
          </picture>
          <span class="zoom-badge"><span aria-hidden="true">🔍 </span>לחצו להגדלה</span>
        </button>
      </figure>
    </section>

    <!-- פרנסי השבוע -->
    <section class="section parnasim" aria-labelledby="parnasim-title">
      <h2 id="parnasim-title">פרנסי השבוע</h2>
      <div class="parnasim-card" id="parnasim-text"></div>
    </section>

  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span id="footer-name">בית הכנסת</span></p>
    <p class="copyright">כל הזכויות שמורות ל-<bdi>bsaviran</bdi></p>
  </footer>

  <!-- חלון הגדלת תמונה -->
  <dialog class="lightbox" id="lightbox" aria-label="תמונה מוגדלת">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="סגירה">✕</button>
    <!-- tabindex: כדי שאפשר יהיה לגלול את התמונה גם במקלדת -->
    <div class="lightbox-scroll" tabindex="0" role="region" aria-label="תמונת אברכי הכולל, ניתן לגלול">
      <picture>
        <source srcset="img/kollel-2758.webp" type="image/webp">
        <img src="kollel.jpg" alt="אברכי כולל מטה משה, שנת תשפ״ו" width="2758" height="1548" loading="lazy" decoding="async">
      </picture>
    </div>
  </dialog>
</body>
</html>
